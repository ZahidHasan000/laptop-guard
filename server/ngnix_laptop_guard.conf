# Nginx config for Laptop Guard Server
# /etc/nginx/sites-available/laptop-guard
# sudo ln -s /etc/nginx/sites-available/laptop-guard /etc/nginx/sites-enabled/
# sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;

    # Max upload: webcam image (10MB)
    client_max_body_size 12M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
# After certbot: HTTPS block auto-added above